name: quicknotion
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  data_connection_checker_tv: ^0.3.5-nullsafety
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_getit: ^3.0.1
  flutter_web_auth_2: ^4.1.0
  font_awesome_flutter: ^10.12.0
  hive: ^2.2.3
  http: ^1.6.0
  intl: ^0.18.1
  logger: ^2.6.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/
  uses-material-design: true

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utls/
  filename: app_images.dart