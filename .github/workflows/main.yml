on: 
  workflow_dispatch: 
    inputs:
      environment:
        description: "Choose env"
        required: true
        default: "staging"
        type: choice
        options:
          - staging 
          - production
  repository_dispatch:
    types:
      - incident_report 
      

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy app
        run: echo "deploying the app to ${{inputs.environment}}"
  
  job_1:
    runs-on: ubuntu-latest
    steps:
      - run: "echo job ${{github.job}}"
      
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - run: "echo Job ${{github.job}}"
      
  job_3: 
    runs-on: ubuntu-latest
    needs: 
      - job_1
      - job_2
    steps:
      - run: "echo Job ${{github.job}}"
  job_4: 
    runs-on: ubuntu-latest
    needs: 
      - job_1
      - job_2
    steps:
      - run: "echo Job ${{github.job}}"
